# Despliegue cloud de la plataforma MOOC.
# Las dependencias administradas (PostgreSQL y almacenamiento de objetos) son
# externas; Redis y ClamAV corren como contenedores en Worker Server.
# Se invoca con --project-directory en la raíz del repositorio:
#   docker compose --project-directory /opt/mooc \
#     -f scripts/IaC/deploy/docker-compose.cloud.yml up -d <servicios>
name: mooc-cloud

services:
  # Cola de mensajería (asynq). Solo alcanzable desde la red privada.
  #
  # maxmemory + volatile-ttl: Redis no debe poder tumbar la VM por su cuenta. Todas
  # las claves de sesión llevan TTL, así que volatile-ttl expira primero la que está
  # por caducar en lugar de rechazar escrituras nuevas.
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # El antimalware es el consumidor de memoria de esta VM: clamd cargó 913 MB con
  # la base de firmas y el OOM killer lo mató (ver docs/entrega2/evidencia/). El
  # mem_limit está por encima de ese pico para que no lo mate antes de tiempo, y
  # para que si alguna vez lo supera muera clamd y no una cadena de servicios: sin
  # él, la presión de memoria dejó a Redis sin responder y tumbó la autenticación
  # de toda la plataforma, que vive en otra VM.
  #
  # El pico no se puede bajar desde aquí: la imagen clamav/clamav:stable trae
  # /etc/clamav/clamd.conf horneado y no interpola variables de entorno, así que
  # CLAMD_CONF_* sería un no-op. Y ConcurrentDatabaseReload solo afecta a recargas
  # posteriores, no a la carga inicial que provocó el OOM (538 s tras arrancar).
  # Reducir el pico real exigiría montar un clamd.conf propio o menos firmas, y
  # el ajuste que sí cabe en 2 GiB es el swap del startup más este límite.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    platform: linux/amd64
    mem_limit: 1200m
    volumes:
      - clamav_data:/var/lib/clamav

  # Servidor SMTP de pruebas con captura de correos (Web Server). La API lo
  # alcanza por la red interna como mailpit:1025; la UI (8025) solo escucha en
  # loopback y se accede por túnel IAP.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data

  # API modular en Go (Web Server).
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    # Solo loopback: el Ops Agent de la VM scrapea /metrics por aquí y así el
    # puerto no queda alcanzable desde la red ni desde Internet.
    ports:
      - "127.0.0.1:8080:8080"

  # Frontend Next.js existente (opcional).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    expose:
      - "3000"

  # Proxy inverso con TLS (Web Server).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      MOOC_DOMAIN: ${MOOC_DOMAIN}
    volumes:
      - ./scripts/IaC/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Workers en Go con ffmpeg (Worker Server).
  # El límite del worker va por encima de su uso normal, no ajustado a él. Los
  # procesos ffmpeg son hijos del worker y cuentan contra este mismo límite: con
  # 512m, cinco transcodificaciones simultáneas de 1080p (unos 130 MB cada una)
  # lo superaban y el cgroup las mataba con "signal: killed", dejando el recurso
  # en processing_status=failed. 1024m deja pasar la tanda y sigue sirviendo de
  # contención: con clamd resident (~850 MB) el tope del host sigue siendo el
  # backstop real.
  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    mem_limit: 1024m
    env_file:
      - .env
    environment:
      CLAMAV_HOST: clamav:3310
      # Puerto del /metrics del worker, solo en loopback para el Ops Agent.
      METRICS_ADDR: "${METRICS_ADDR:-:9101}"
    expose:
      - "9101"
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      - redis
      - clamav

volumes:
  redis_data:
  clamav_data:
  mailpit_data:
  caddy_data:
  caddy_config:
