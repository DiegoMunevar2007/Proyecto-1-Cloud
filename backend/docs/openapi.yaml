externalDocs:
  description: ""
  url: ""
info:
  description: |-
    API REST del monolito modular: identidad y sesiones, administración y auditoría, autoría de cursos versionados y carga multimedia con procesamiento asíncrono a HLS.
    Autenticación con JWT revocable: iniciar sesión en /auth/login y enviar `Authorization: Bearer <token>`.
  title: Plataforma MOOC - API
  version: "1.0"
openapi: 3.1.0
paths:
  /admin/audit:
    get:
      description: Registros inmutables de acciones administrativas, filtrables por
        actor, objetivo, acción y rango de fechas.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Filtro por actor (username)
        in: query
        name: actor
        schema:
          type: string
      - description: Filtro por usuario objetivo
        in: query
        name: target
        schema:
          type: string
      - description: Filtro por acción
        in: query
        name: action
        schema:
          type: string
      - description: Desde (fecha)
        in: query
        name: from
        schema:
          type: string
      - description: Hasta (fecha)
        in: query
        name: to
        schema:
          type: string
      - description: Página (base 1)
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Resultados por página (máx 100)
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.AuditListResponse'
          description: Registros de auditoría
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Error interno
      security:
      - BearerAuth: []
      summary: Listar auditoría
      tags:
      - Administración
  /admin/sessions:
    delete:
      description: Revoca el token indicado (cuerpo o query) con registro en auditoría.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Token a revocar (alternativo)
        in: query
        name: token
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin.SessionTokenRequest'
              description: Token a revocar (o query param token)
              summary: request
        description: Token a revocar (o query param token)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.MessageResponse'
          description: Sesión revocada
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Falta el token a revocar
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Error interno
      security:
      - BearerAuth: []
      summary: Revocar una sesión
      tags:
      - Administración
  /admin/stats:
    get:
      description: Totales de usuarios por estado y administradores activos.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.StatsResponse'
          description: Estadísticas
      security:
      - BearerAuth: []
      summary: Estadísticas
      tags:
      - Administración
  /admin/users:
    get:
      description: Lista paginada de usuarios con búsqueda por texto, filtros por
        rol, estado y verificación.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: Búsqueda en username y email
        in: query
        name: search
        schema:
          type: string
      - description: Filtro por rol (student, professor, admin)
        in: query
        name: role
        schema:
          type: string
      - description: Filtro por estado (active, inactive, blocked)
        in: query
        name: status
        schema:
          type: string
      - description: Filtro por verificación
        in: query
        name: verified
        schema:
          type: boolean
      - description: Página (base 1)
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Resultados por página (máx 100)
        in: query
        name: limit
        schema:
          default: 20
          type: integer
      - description: 'Orden: columna y dirección (ej. username asc)'
        in: query
        name: sort
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.UserListResponse'
          description: Listado de usuarios
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: No autenticado
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Se requiere rol admin
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Error interno
      security:
      - BearerAuth: []
      summary: Listar usuarios
      tags:
      - Administración
  /admin/users/{id}:
    delete:
      description: Soft delete con auditoría y revocación de sesiones. Protege al
        último administrador activo.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID del usuario
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.MessageResponse'
          description: Usuario eliminado (soft delete)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: ID inválido
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Usuario no encontrado
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: No se puede dejar el sistema sin administrador
      security:
      - BearerAuth: []
      summary: Eliminar usuario
      tags:
      - Administración
    get:
      description: Retorna la representación pública de un usuario (sin contraseña).
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID del usuario
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.UserDetailResponse'
          description: Usuario encontrado
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: ID inválido
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: No autenticado
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Se requiere rol admin
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Usuario no encontrado
      security:
      - BearerAuth: []
      summary: Obtener usuario
      tags:
      - Administración
  /admin/users/{id}/restore:
    post:
      description: Revierte el soft delete de un usuario, con registro en auditoría.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID del usuario
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.UserMessageResponse'
          description: Usuario restaurado
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: ID inválido
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Error interno
      security:
      - BearerAuth: []
      summary: Restaurar usuario
      tags:
      - Administración
  /admin/users/{id}/role:
    put:
      description: Actualiza el rol de un usuario y registra la acción en auditoría.
        No permite degradar al último administrador activo.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID del usuario
        in: path
        name: id
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/admin.RoleUpdateRequest'
              description: Nuevo rol
              summary: request
        description: Nuevo rol
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.UserMessageResponse'
          description: Rol actualizado
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: ID inválido, rol inválido o falta el campo
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Usuario no encontrado
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: No se puede dejar el sistema sin administrador
      security:
      - BearerAuth: []
      summary: Cambiar rol
      tags:
      - Administración
  /admin/users/{id}/sessions:
    delete:
      description: Elimina todos los tokens activos de un usuario, con registro en
        auditoría.
      parameters:
      - description: Bearer <token de admin>
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: ID del usuario
        in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/admin.RevokeSessionsResponse'
          description: Sesiones revocadas
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: ID inválido
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/utils.ErrorResponse'
          description: Usuario no encontrado
      security:
      - BearerAuth: []
      summary: Revocar sesiones
      tags:
      - Administración
    get:
